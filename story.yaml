global_constraints:
  entities:
    - text: 旧厂房
      attrs:
        - 空旷
        - 有阳光照射
        - 有灰尘
        - 有生锈机器
        - 墙皮脱落
        - 有工具箱
    - text: 男人
      attrs:
        - 穿着褪色工装
        - 有汗水
        - 使用袖子擦汗
        - 蹲姿检查机器
        - 站立行走
        - 使用扳手
    - text: 机器
      attrs:
        - 生锈
        - 有阀门
        - 有锈死螺丝
        - 需要维修
        - 位于厂房中央
    - text: 工具箱
      attrs:
        - 位于墙角
        - 金属材质
        - 开盖有摩擦声
        - 内有扳手
    - text: 扳手
      attrs:
        - 金属工具
        - 用于拧螺丝
        - 从工具箱取出
  rules:
    - 男人的工装服装款式和褪色程度在所有分镜中保持一致
    - 旧厂房的空间结构和主要机器位置在不同分镜中保持连贯
    - 工具箱的位置始终在墙角，且外观特征不变
    - 扳手作为关键道具，其型号和锈蚀程度需保持一致
    - 机器上的阀门和螺丝位置与锈蚀状态需前后一致
    - 阳光照射角度和灰尘漂浮效果需符合午后时段的自然光照逻辑
    - 男人的动作序列需符合逻辑顺序：蹲下检查-起身-取工具-维修
    - 厂房环境细节如墙皮脱落程度需保持连续性
  style: 写实主义风格的工业场景，带有怀旧氛围和细腻的光影细节
  negative:
    - 卡通风格
    - 色彩鲜艳
    - 现代设备
    - 干净整洁
    - 人物特写失真
    - 不符合物理规律的光影
scenes:
  - index: 1
    text: 午后阳光斜照进空旷的旧厂房，灰尘在光柱中缓慢漂浮
    prompt: 写实主义风格，空旷的旧厂房内部，午后阳光从窗户斜射进来形成光柱，灰尘颗粒在光柱中缓慢漂浮，厂房空间宽敞有废弃感，墙皮有脱落痕迹，中央放置着生锈的机器，整体氛围怀旧
    negative:
      - 人物出现
      - 现代装饰
      - 明亮色彩
      - 干净环境
  - index: 2
    text: 一个穿着褪色工装的男人蹲在生锈的机器旁，手指轻轻抚过锈迹斑斑的阀门
    prompt: 写实主义风格，穿着褪色工装的男人蹲在厂房中央的生锈机器旁，手指轻轻抚过机器上锈迹斑斑的阀门，午后阳光斜照，灰尘在背景光柱中漂浮，机器锈蚀严重但结构完整
    negative:
      - 站立姿势
      - 干净工装
      - 新机器
      - 无灰尘环境
  - index: 3
    text: 他站起身，环顾四周，目光落在墙角的工具箱上
    prompt: 写实主义风格，穿着褪色工装的男人从蹲姿站起身，环视空旷的旧厂房，目光聚焦在墙角的金属工具箱上，午后阳光照射，背景可见中央的生锈机器和漂浮的灰尘
    negative:
      - 看向其他方向
      - 工具箱位置改变
      - 突然出现其他人物
  - index: 4
    text: 他走到工具箱旁，箱盖打开时发出刺耳的金属摩擦声
    prompt: 写实主义风格，穿着褪色工装的男人走到墙角工具箱旁，正在打开金属工具箱盖，表现出刺耳的金属摩擦声效果，工具箱位于墙角位置正确，背景可见厂房中央的生锈机器
    negative:
      - 工具箱材质改变
      - 无声打开
      - 位置不符
  - index: 5
    text: 他取出一把扳手，回到机器前
    prompt: 写实主义风格，穿着褪色工装的男人从墙角工具箱中取出一把金属扳手，然后转身走向厂房中央的生锈机器，手持扳手准备维修，扳手有使用痕迹
    negative:
      - 其他工具
      - 扳手崭新
      - 行走方向错误
  - index: 6
    text: 他开始用力拧动一颗早已锈死的螺丝，汗水顺着鬓角滑落
    prompt: 写实主义风格，穿着褪色工装的男人在厂房中央的生锈机器前，用力拧动一颗锈死的螺丝，额头有汗水顺着鬓角滑落，表情专注用力，扳手握在手中
    negative:
      - 轻松拧动
      - 无汗水
      - 螺丝位置改变
  - index: 7
    text: 远处传来火车驶过的轰鸣，厂房微微震动，墙皮簌簌落下
    prompt: 写实主义风格，旧厂房场景，远处传来火车驶过的轰鸣声，厂房结构微微震动，墙皮簌簌落下，男人仍在机器前工作，阳光和灰尘效果保持
    negative:
      - 剧烈震动
      - 墙体完好
      - 无声环境
  - index: 8
    text: 他终于拧动了那颗螺丝，长舒一口气，用袖子擦了擦额头的汗
    prompt: 写实主义风格，穿着褪色工装的男人成功拧动了锈死螺丝后长舒一口气，用袖子擦拭额头的汗水，表情放松，扳手放在机器旁，厂房环境保持一致性
    negative:
      - 失败表情
      - 使用其他物品擦汗
      - 环境突变
